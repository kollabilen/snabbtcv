<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnabbtCV - Skapa ditt CV gratis</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2pdf.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md no-print">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">SnabbtCV.se</h1>
            <button onclick="generatePDF()" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded shadow transition">
                Ladda ner PDF
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto my-8 p-4 grid grid-cols-1 md:grid-cols-2 gap-8">
        
        <!-- Form Section -->
        <section class="bg-white p-6 rounded-lg shadow no-print space-y-4">
            <h2 class="text-xl font-bold border-b pb-2">Fyll i dina uppgifter</h2>
            
            <!-- Profile Image Input -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Profilbild</label>
                <input type="file" id="inputImage" accept="image/*" onchange="previewImage(event)" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
            </div>

            <!-- Personal Info -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Namn</label>
                    <input type="text" id="inputName" oninput="updateCV()" placeholder="Förnamn Efternamn" class="mt-1 w-full p-2 border rounded">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Titel</label>
                    <input type="text" id="inputTitle" oninput="updateCV()" placeholder="t.ex. Lagerarbetare" class="mt-1 w-full p-2 border rounded">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">E-post</label>
                    <input type="email" id="inputEmail" oninput="updateCV()" placeholder="din.e-post@gmail.com" class="mt-1 w-full p-2 border rounded">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Telefon</label>
                    <input type="tel" id="inputPhone" oninput="updateCV()" placeholder="070 123 45 67" class="mt-1 w-full p-2 border rounded">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Körkort / Licenses</label>
                <input type="text" id="inputLicenses" oninput="updateCV()" placeholder="t.ex. B-körkort, Truckkort (A1-A4, B1-B4)" class="mt-1 w-full p-2 border rounded">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Om mig</label>
                <textarea id="inputSummary" oninput="updateCV()" rows="3" placeholder="Kort beskrivning om dig själv..." class="mt-1 w-full p-2 border rounded"></textarea>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Arbetslivserfarenhet</label>
                <textarea id="inputExperience" oninput="updateCV()" rows="4" placeholder="Företag - Roll (År)&#10;Beskriv dina arbetsuppgifter..." class="mt-1 w-full p-2 border rounded"></textarea>
            </div>
        </section>

        <!-- Preview Section -->
        <section class="bg-white p-8 rounded-lg shadow min-h-[600px]" id="cv-template">
            <div class="flex items-center space-x-6 border-b pb-6">
                <!-- Profile Image Container with object-cover fixing distortion -->
                <div class="w-28 h-28 rounded-full overflow-hidden border-2 border-blue-600 flex-shrink-0 bg-gray-100">
                    <img id="cvImage" src="https://via.placeholder.com/150" alt="Profilbild" class="w-full h-full object-cover object-center hidden">
                </div>
                
                <div>
                    <h2 id="cvName" class="text-3xl font-bold text-gray-800">Ditt Namn</h2>
                    <p id="cvTitle" class="text-lg text-blue-600 font-medium">Din Yrkesroll</p>
                    <div class="text-sm text-gray-600 mt-2 space-y-1">
                        <p id="cvEmail">E-post: -</p>
                        <p id="cvPhone">Telefon: -</p>
                        <p id="cvLicenses" class="font-semibold text-gray-700"></p>
                    </div>
                </div>
            </div>

            <div class="mt-6 space-y-6">
                <div>
                    <h3 class="text-lg font-bold text-gray-800 border-b mb-2">Om mig</h3>
                    <p id="cvSummary" class="text-gray-700 whitespace-pre-line">Här visas din beskrivning...</p>
                </div>

                <div>
                    <h3 class="text-lg font-bold text-gray-800 border-b mb-2">Arbetslivserfarenhet</h3>
                    <p id="cvExperience" class="text-gray-700 whitespace-pre-line">Här visas dina tidigare arbeten...</p>
                </div>
            </div>
        </section>

    </main>

    <!-- JavaScript Logic -->
    <script>
        function updateCV() {
            document.getElementById('cvName').innerText = document.getElementById('inputName').value || 'Ditt Namn';
            document.getElementById('cvTitle').innerText = document.getElementById('inputTitle').value || 'Din Yrkesroll';
            document.getElementById('cvEmail').innerText = 'E-post: ' + (document.getElementById('inputEmail').value || '-');
            document.getElementById('cvPhone').innerText = 'Telefon: ' + (document.getElementById('inputPhone').value || '-');
            
            const licenses = document.getElementById('inputLicenses').value;
            document.getElementById('cvLicenses').innerText = licenses ? 'Körkort/Kvalifikationer: ' + licenses : '';

            document.getElementById('cvSummary').innerText = document.getElementById('inputSummary').value || 'Här visas din beskrivning...';
            document.getElementById('cvExperience').innerText = document.getElementById('inputExperience').value || 'Här visas dina tidigare arbeten...';
        }

        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const output = document.getElementById('cvImage');
                output.src = reader.result;
                output.classList.remove('hidden');
            };
            if (event.target.files[0]) {
                reader.readAsDataURL(event.target.files[0]);
            }
        }

        function generatePDF() {
            const element = document.getElementById('cv-template');
            const opt = {
                margin:       0.5,
                filename:     'Mitt_CV.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        }
    </script>
</body>
</html>
