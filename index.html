<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnabbtCV - Skapa ditt CV enkelt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-600">SnabbtCV</h1>
            <div class="flex items-center gap-3">
                <button id="save-cv-btn" class="hidden bg-green-600 hover:bg-green-700 text-white text-xs px-3 py-2 rounded-lg font-semibold transition">
                    💾 Spara CV
                </button>
                <button id="auth-btn" class="bg-slate-800 hover:bg-slate-700 text-white text-xs px-3 py-2 rounded-lg font-semibold transition">
                    Logga in
                </button>
                <button id="download-pdf-btn" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-4 py-2 rounded-lg font-semibold transition shadow-sm">
                    📄 Ladda ner PDF
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <!-- Left Column: Form Inputs -->
        <div class="space-y-6">
            
            <!-- Personuppgifter -->
            <section class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-4">
                <h2 class="text-base font-bold text-slate-800 border-b border-slate-100 pb-2">Personuppgifter</h2>
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Förnamn</label>
                        <input type="text" id="input-firstname" class="cv-input w-full border border-slate-200 rounded-lg p-2 text-xs outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Efternamn</label>
                        <input type="text" id="input-lastname" class="cv-input w-full border border-slate-200 rounded-lg p-2 text-xs outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Önskad tjänst (Titel)</label>
                    <input type="text" id="input-title" class="cv-input w-full border border-slate-200 rounded-lg p-2 text-xs outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">E-postadress</label>
                        <input type="email" id="input-email" class="cv-input w-full border border-slate-200 rounded-lg p-2 text-xs outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Telefonnummer</label>
                        <input type="text" id="input-phone" class="cv-input w-full border border-slate-200 rounded-lg p-2 text-xs outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-3">
                    <div class="col-span-1">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Adress</label>
                        <input type="text" id="input-address" class="cv-input w-full border border-slate-200 rounded-lg p-2 text-xs outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Postnummer</label>
                        <input type="text" id="input-zip" class="cv-input w-full border border-slate-200 rounded-lg p-2 text-xs outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Ort</label>
                        <input type="text" id="input-city" class="cv-input w-full border border-slate-200 rounded-lg p-2 text-xs outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Födelsedatum</label>
                        <input type="text" id="input-dob" class="cv-input w-full border border-slate-200 rounded-lg p-2 text-xs outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">LinkedIn / Webbplats</label>
                        <input type="text" id="input-website" class="cv-input w-full border border-slate-200 rounded-lg p-2 text-xs outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Körkort</label>
                        <input type="text" id="input-korkort" class="cv-input w-full border border-slate-200 rounded-lg p-2 text-xs outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Truckkort</label>
                        <input type="text" id="input-truckkort" class="cv-input w-full border border-slate-200 rounded-lg p-2 text-xs outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
            </section>

            <!-- Profil / Sammanfattning -->
            <section class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-3">
                <h2 class="text-base font-bold text-slate-800 border-b border-slate-100 pb-2">Profil / Sammanfattning</h2>
                <textarea id="input-summary" rows="4" class="cv-input w-full border border-slate-200 rounded-lg p-2 text-xs outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
            </section>

            <!-- Arbetslivserfarenhet -->
            <section class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-4">
                <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                    <h2 class="text-base font-bold text-slate-800">Arbetslivserfarenhet</h2>
                    <button id="add-work-btn" class="text-xs bg-blue-50 text-blue-600 px-2.5 py-1 rounded-lg font-semibold hover:bg-blue-100 transition">+ Lägg till</button>
                </div>
                <div id="work-list" class="space-y-4"></div>
            </section>

            <!-- Utbildning -->
            <section class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-4">
                <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                    <h2 class="text-base font-bold text-slate-800">Utbildning</h2>
                    <button id="add-edu-btn" class="text-xs bg-blue-50 text-blue-600 px-2.5 py-1 rounded-lg font-semibold hover:bg-blue-100 transition">+ Lägg till</button>
                </div>
                <div id="edu-list" class="space-y-4"></div>
            </section>

            <!-- Färdigheter & Språk -->
            <section class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-4">
                <h2 class="text-base font-bold text-slate-800 border-b border-slate-100 pb-2">Färdigheter & Språk</h2>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Färdigheter (Kommateckenmellanrum)</label>
                    <input type="text" id="input-skills" class="cv-input w-full border border-slate-200 rounded-lg p-2 text-xs outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Språk (Kommateckenmellanrum)</label>
                    <input type="text" id="input-languages" class="cv-input w-full border border-slate-200 rounded-lg p-2 text-xs outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </section>

            <!-- Referenser -->
            <section class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-3">
                <h2 class="text-base font-bold text-slate-800 border-b border-slate-100 pb-2">Referenser</h2>
                <textarea id="input-references" rows="2" class="cv-input w-full border border-slate-200 rounded-lg p-2 text-xs outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
            </section>

        </div>

        <!-- Right Column: Live CV Preview -->
        <div class="lg:sticky lg:top-20 h-fit">
            <div id="cv-preview" class="bg-white p-8 rounded-xl border border-slate-200 shadow-lg space-y-6 text-slate-800 text-sm">
                
                <!-- Preview Header -->
                <div class="border-b border-slate-200 pb-4">
                    <h1 id="preview-name" class="text-2xl font-bold text-slate-900"></h1>
                    <p id="preview-title" class="text-blue-600 font-semibold text-sm"></p>
                    
                    <div id="preview-contact" class="mt-3 flex flex-wrap gap-x-4 gap-y-1 text-xs text-slate-500"></div>
                </div>

                <!-- Preview Summary -->
                <div id="preview-summary-section" class="hidden space-y-1">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Profil</h3>
                    <p id="preview-summary" class="text-xs leading-relaxed text-slate-700"></p>
                </div>

                <!-- Preview Work -->
                <div id="preview-work-section" class="hidden space-y-2">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Arbetslivserfarenhet</h3>
                    <div id="preview-work-list" class="space-y-3"></div>
                </div>

                <!-- Preview Education -->
                <div id="preview-edu-section" class="hidden space-y-2">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Utbildning</h3>
                    <div id="preview-edu-list" class="space-y-3"></div>
                </div>

                <!-- Preview Skills & Languages -->
                <div id="preview-skills-section" class="hidden grid grid-cols-2 gap-4 pt-2 border-t border-slate-100">
                    <div id="preview-skills-container" class="hidden">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Färdigheter</h3>
                        <p id="preview-skills" class="text-xs text-slate-700"></p>
                    </div>
                    <div id="preview-languages-container" class="hidden">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Språk</h3>
                        <p id="preview-languages" class="text-xs text-slate-700"></p>
                    </div>
                </div>

                <!-- Preview References -->
                <div id="preview-refs-section" class="hidden space-y-1 border-t border-slate-100 pt-3">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Referenser</h3>
                    <p id="preview-references" class="text-xs text-slate-700"></p>
                </div>

            </div>
        </div>

    </main>

    <!-- Modal for Auth -->
    <div id="auth-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center hidden z-50">
        <div class="bg-white p-6 rounded-xl shadow-xl w-80 relative">
            <button id="close-modal-btn" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 font-bold">✕</button>
            <h3 id="modal-title" class="text-base font-bold text-gray-800 mb-4">Logga in</h3>
            
            <form id="auth-form" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">E-post</label>
                    <input type="email" id="auth-email" required class="w-full border border-gray-200 rounded-lg p-2 text-xs outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">Lösenord</label>
                    <input type="password" id="auth-password" required class="w-full border border-gray-200 rounded-lg p-2 text-xs outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                
                <button type="submit" id="auth-submit-btn" class="w-full bg-blue-600 text-white py-2 rounded-lg text-xs font-semibold mt-2">
                    Logga in
                </button>
            </form>
            
            <div class="mt-4 text-center">
                <button id="toggle-auth-mode" class="text-xs text-blue-600 hover:underline">
                    Skapa ett konto?
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
